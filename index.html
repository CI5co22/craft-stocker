
<!DOCTYPE html>
<html lang="es" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>Karoo |Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              accent: {
                DEFAULT: '#10b981',
                hover: '#059669',
                soft: 'rgba(16, 185, 129, 0.1)',
              },
              surface: {
                light: '#ffffff',
                dark: '#0f172a',
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            },
            borderRadius: {
              'xl': '1rem',
              '2xl': '1.5rem',
              '3xl': '2rem',
            },
            boxShadow: {
              'fluent': '0 8px 30px rgba(0,0,0,0.04)',
              'fluent-dark': '0 8px 30px rgba(0,0,0,0.2)',
              'glass': 'inset 0 0 0 1px rgba(255,255,255,0.1)',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --transition-speed: 0.25s;
        --ease-fluent: cubic-bezier(0.33, 1, 0.68, 1);
      }

      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-smoothing: grayscale;
        overflow-x: hidden;
      }

      * {
        transition: background-color var(--transition-speed) var(--ease-fluent), 
                    border-color var(--transition-speed) var(--ease-fluent), 
                    transform var(--transition-speed) var(--ease-fluent),
                    opacity var(--transition-speed) var(--ease-fluent),
                    box-shadow var(--transition-speed) var(--ease-fluent);
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }

      .dark .glass-card {
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .stagger-in > * {
        opacity: 0;
        transform: translateY(20px);
        animation: slideIn 0.4s var(--ease-fluent) forwards;
      }

      @keyframes slideIn {
        to { opacity: 1; transform: translateY(0); }
      }

      .stagger-in > *:nth-child(1) { animation-delay: 0.05s; }
      .stagger-in > *:nth-child(2) { animation-delay: 0.1s; }
      .stagger-in > *:nth-child(3) { animation-delay: 0.15s; }
      .stagger-in > *:nth-child(4) { animation-delay: 0.2s; }

      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(0,0,0,0.1);
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      .dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }
      
      .view-toggle-active {
        background: #10b981;
        color: white;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
        "@vercel/blob": "https://aistudiocdn.com/@vercel/blob@^2.0.0",
        "@vercel/kv": "https://aistudiocdn.com/@vercel/kv@^3.0.0",
        "@vercel/node": "https://aistudiocdn.com/@vercel/node@^5.5.14",
        "ioredis": "https://esm.sh/ioredis@^5.8.2",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-50 dark:bg-slate-950 selection:bg-emerald-100 selection:text-emerald-900">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
